name: Publish reader website
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout public website
        uses: actions/checkout@v4
      - name: Check JavaScript and reader entry points
        run: |
          node --check app.js
          node --check scripts/build-static.js
          grep -q 'chapter-one.html' index.html
          grep -q 'reader-prose' chapter-one.html
          grep -q 'issues/1' feedback.html
      - name: Build spoiler-safe allowlisted site
        shell: bash
        run: |
          mkdir -p _site/chapters _site/assets/images/chapters _site/assets/images/characters
          cp index.html chapter-one.html feedback.html styles.css app.js google6a72b1af88a0a393.html _site/
          cp chapters/chapter-one.md _site/chapters/
          cp 'Rope Mishap on the Misty Dock.png' _site/assets/images/chapters/chapter-one-well-the-knot-held.png
          cp 'Cliffside Porter in the Rain.png' _site/assets/images/chapters/chapter-one-not-enough.png
          cp 'Dusk Conversation in the Cliffside Harbour.png' _site/assets/images/chapters/chapter-one-a-better-question.png
          cp 'Twilight Harbor City Canyon.png' _site/assets/images/deepwater-city-below.png
          cp 'Lower Level.png' _site/assets/images/deepwater-working-waterfront.png
          test -s _site/assets/images/deepwater-working-waterfront.png
          cp 'Weary Rogue in the Misty Cliffside Harbour.png' _site/assets/images/characters/elias-varek.png
          cp 'Mira Varek at the Misty Harbour.png' _site/assets/images/characters/mira-varek.png
          cp 'Freckled Redhead at the Fogbound Harbour.png' _site/assets/images/characters/maren.png
          test -s _site/assets/images/characters/maren.png
          cp 'Grizzled Captain in the Lantern-Lit Harbour.png' _site/assets/images/characters/bram.png
          test -s _site/assets/images/characters/elias-varek.png
          test -s _site/assets/images/characters/mira-varek.png
          test -s _site/assets/images/characters/bram.png
          test -s _site/assets/images/deepwater-city-below.png
          test -s _site/assets/images/chapters/chapter-one-a-better-question.png
          test -s _site/assets/images/chapters/chapter-one-not-enough.png
          test -s _site/assets/images/chapters/chapter-one-well-the-knot-held.png
          node scripts/build-static.js
          touch _site/.nojekyll
          test -s _site/about.html
          test -s _site/world.html
          test -s _site/lore/elias.html
          test -s _site/sitemap.xml
          test -s _site/robots.txt
          grep -qx 'google-site-verification: google6a72b1af88a0a393.html' _site/google6a72b1af88a0a393.html
          test -s _site/chapter-one.html
          test -s _site/chapters/chapter-one.md
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
