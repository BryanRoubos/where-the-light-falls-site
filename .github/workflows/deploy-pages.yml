name: Publish reader website
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout public website
        uses: actions/checkout@v4
      - name: Build spoiler-safe allowlisted site
        shell: bash
        run: |
          mkdir -p _site/chapters
          cp index.html chapter-one.html feedback.html styles.css app.js _site/
          cp chapters/chapter-one.md _site/chapters/
          touch _site/.nojekyll
          test -s _site/chapter-one.html
          test -s _site/chapters/chapter-one.md
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
