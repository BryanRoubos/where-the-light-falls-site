<form id="feedback-send" action="https://formsubmit.co/roubos@proton.me" method="POST" data-direct-feedback data-ajax-endpoint="https://formsubmit.co/ajax/roubos@proton.me" aria-describedby="feedback-privacy">
<label for="feedback-name">Your name (optional)</label>
<input id="feedback-name" name="name" autocomplete="name" maxlength="100">
<label for="feedback-email">Your email (optional, if you'd like a reply)</label>
<input id="feedback-email" name="email" type="email" autocomplete="email" maxlength="254">
<label for="feedback-message">Your thoughts</label>
<textarea id="feedback-message" name="message" required maxlength="6000" rows="7"></textarea>
<input type="hidden" name="_subject" value="Where the Light Falls — reader feedback">
<input type="hidden" name="_template" value="table">
<input type="hidden" name="_next" value="https://bryanroubos.github.io/where-the-light-falls-site/feedback-thanks.html">
<input class="feedback-honey" type="text" name="_honey" tabindex="-1" autocomplete="off" aria-label="Leave this field empty">
<button class="btn primary" type="submit">Send feedback →</button>
<p id="feedback-privacy" class="privacy-note">Your message and any contact details you choose to include are processed by <a href="https://formsubmit.co/privacy.pdf" target="_blank" rel="noopener noreferrer">FormSubmit</a> and emailed to Bryan. FormSubmit retains submissions for 30 days. Your feedback is not posted publicly and does not sign you up for updates.</p>
<p id="feedback-send-status" role="status" tabindex="-1"></p>
</form>
